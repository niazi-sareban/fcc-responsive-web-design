<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="./styles.css">
    <title>Selection Feature Page</title>
</head>

<body>
    <h1>
        Feature Selection
    </h1>
<div class="feature-card-container">

  <div class="card">
    <label class="feature-card">
      Cloud Storage
      <input type="checkbox">
      <p>100 Gigabyte secure storage</p>
    </label>
  </div>

  <div class="card">
    <label class="feature-card">
      Dedicated Support
      <input type="checkbox">
      <p>24/7 customer support</p>
    </label>
  </div>

  <div class="card">
    <label class="feature-card">
      Advanced Analytics
      <input type="checkbox">
      <p>Detailed usage reports</p>
    </label>
  </div>

  <div class="card">
    <label class="feature-card">
      Custom User Themes
      <input type="checkbox">
      <p>Personalize your dashboard</p>
    </label>
  </div>

  <div class="card">
    <label class="feature-card">
      Multi-User Collab
      <input type="checkbox">
      <p>Work with your team</p>
    </label>
  </div>

  <div class="card">
    <label class="feature-card">
      API Access
      <input type="checkbox">
      <p>Developer integrations</p>
    </label>
  </div>

</div>
</body>

</html>
