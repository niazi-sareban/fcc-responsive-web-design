<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <div class="container">
        <h2>
            Job Application Form
        </h2>
        <form action="">
            
            <label for="name" class="information">Full Name:</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="email" class="information">Email:</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="position" class="information">Position:</label>
            <select name="position" id="position" required>
                <option value="" >
                    Select a position
                </option>
                <option value="developer">Developer</option>
                <option value="designer">Designer</option>
                <option value="manager">Manager</option>
            </select>

            <fieldset class="radio-group">
                <legend>
                    Availability
                </legend>
                <input type="radio" id="full-time" name="availability" checked>
                <label for="full-time">Full-Time</label>

                <input type="radio" id="part-time" name="availability">
                <label for="part-time">Part-Time</label>

            </fieldset>

            <label for="message" class="title-label">Why do you want this job?</label>
            <textarea name="message" id="message" placeholder="Write your motivation"></textarea>

            <button type="submit">Submit Application</button>

        </form>
    </div>
</body>
</html>
